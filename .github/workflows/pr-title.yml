name: PR Title

on:
  pull_request:
    types: [ opened, edited, synchronize, reopened ]

permissions:
  pull-requests: read

jobs:
  title:
    name: PR Title
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}