spring.application.name=hophop
# env.properties only exists on your laptop. On Render the same values come from environment variables.
spring.config.import=optional:file:src/main/resources/env.properties
# Render tells the app which port to use through PORT
server.port=${PORT:8080}
# --- MySQL (secrets come from environment variables, never commit them) ---
spring.datasource.url=${DB_DATASOURCE_URL}
# --- jdbc:mysql://localhost:3306/hophop?createDatabaseIfNotExist=true&serverTimezone=Asia/Manila
spring.datasource.username=${DB_USERNAME:hophop}
spring.datasource.password=${DB_PASSWORD}
# Flyway runs the files in src/main/resources/database/migration when the app starts. Hibernate only reads/writes the tables
spring.jpa.hibernate.ddl-auto=none
spring.flyway.locations=classpath:database/migration
# The TiDB database set up by hand needs src/main/resources/database/flyway_baseline.sql run once. An empty one needs nothing.
spring.jpa.open-in-view=false
# --- CORS: the React dev server (comma-separate to allow more origins) ---
app.cors.allowed-origins=${LOCALHOST_URL:http://localhost:5173}
# Used for "today" when an application is saved without a date
app.timezone=Asia/Manila
# --- Gemini AI: free key from https://aistudio.google.com/apikey ---
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=gemini-3.5-flash
# Tried in order when the main model is busy (503) or over its limit (429)
gemini.fallback-models=${GEMINI_FALLBACK_MODELS:gemini-3.5-flash-lite,gemini-3.1-flash-lite}
# Sign-in: one owner, authenticator app code, no password. The API stays locked until AUTH_TOTP_SECRET is set.
auth.totp-secret=${AUTH_TOTP_SECRET:}
# Set only while you scan the QR code at /api/auth/setup?token=..., then remove it.
auth.setup-token=${AUTH_SETUP_TOKEN:}
auth.issuer=HopHop
# A session ends after this long with no requests, or after max-hours in total.
auth.idle-seconds=${AUTH_IDLE_SECONDS:1800}
auth.max-hours=${AUTH_MAX_HOURS:12}
