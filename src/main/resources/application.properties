spring.application.name=hophop
spring.config.import=file:src/main/resources/env.properties
# --- MySQL (secrets come from environment variables, never commit them) ---
spring.datasource.url=${DB_DATASOURCE_URL}
# --- jdbc:mysql://localhost:3306/hophop?createDatabaseIfNotExist=true&serverTimezone=Asia/Manila
spring.datasource.username=${DB_USERNAME:hophop}
spring.datasource.password=${DB_PASSWORD}
# Flyway creates the tables (see db/migration), Hibernate only reads/writes them
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# --- CORS: the React dev server (comma-separate to allow more origins) ---
app.cors.allowed-origins=${LOCALHOST_URL}
# Used for "today" when an application is saved without a date
app.timezone=Asia/Manila
# --- Gemini AI: free key from https://aistudio.google.com/apikey ---
gemini.api-key=${GEMINI_API_KEY}
gemini.model=gemini-2.5-flash